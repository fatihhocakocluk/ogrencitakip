<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Veli Paneli</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
<header class="top"><strong>Veli paneli</strong><span><span id="who"></span> <button id="out">Çıkış</button></span></header>
<div class="layout">
  <aside>
    <div class="card">
      <h3>Çocuğunuzu ekleyin</h3>
      <form id="link">
        <label>Çocuğunuzun adı soyadı<input id="cn" required></label>
        <button class="btn">Ekle</button>
      </form>
      <p id="msg" class="err"></p>
    </div>
    <div class="card" style="margin-top:14px">
      <h3>Çocuklarım</h3>
      <div id="kids" class="list"></div>
    </div>
  </aside>
  <main class="card">
    <div id="hd"><p class="mut">Bilgileri görmek için çocuğunuzun adını girin.</p></div>
    <div id="main"></div>
  </main>
</div>
<script type="module" src="parent.js"></script>
</body>
</html>
